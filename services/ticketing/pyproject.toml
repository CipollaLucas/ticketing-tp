[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketing-independent-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3", "httpx>=0.27,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.14,<2"]
[tool.setuptools.packages.find]
include = ["ticketing_service*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["EXE002"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
