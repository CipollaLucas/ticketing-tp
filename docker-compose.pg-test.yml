# Isolated disposable PostgreSQL for regression tests. Do not use active Legacy/Identity DBs.
services:
  pg-migration-test:
    image: postgres:16-alpine
    profiles: ["pg-migration-test"]
    environment:
      POSTGRES_USER: migration_test
      POSTGRES_PASSWORD: migration-test-only
      POSTGRES_DB: migration_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration_test -d migration_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  backend:
    environment:
      TEST_POSTGRES_URL: postgresql+psycopg://migration_test:migration-test-only@pg-migration-test:5432/migration_test
