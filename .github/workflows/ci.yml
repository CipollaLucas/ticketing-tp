name: CI
on:
  pull_request:
    branches: [main, feat/ticket-inventory]
  push:
    branches: [main]
jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticket-inventory --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticket-purchasing --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate microservices-hexagonal-migration --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticketing-hexagonal-uow --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticketing-hexagonal-inventory-queries --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-independent-foundation --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-remote-introspection --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-backfill-preflight --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-cutover-readiness --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-backup-restore-verification --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-readonly-auth-canary --strict
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check --diff . || true
      - run: ruff check .
      - run: mypy app
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build

  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-identity-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-identity-only@localhost:5432/postgres
      IDENTITY_INTERNAL_TOKEN: ci-only-identity-internal-token-for-tests-2026
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy identity
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q
      - run: docker build -t identity-service-ci .
        working-directory: services/identity

  identity-contract:
    runs-on: ubuntu-latest
    env:
      IDENTITY_INTERNAL_TOKEN: ci-only-contract-internal-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build Identity and legacy backend with private networking
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity build identity backend
      - name: Start private Identity PostgreSQL
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity up -d identity-db
      - name: Apply Identity-owned migration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity run --rm identity alembic upgrade head
      - name: Start Identity and legacy backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity up -d identity backend
      - name: Verify remote login, token introspection and logout
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity exec -T backend python identity_contract_smoke.py

  db-backup-restore:
    runs-on: ubuntu-latest
    env:
      IDENTITY_INTERNAL_TOKEN: ci-backup-configuration-only-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build backend and Identity images
        run: |
          docker compose -f docker-compose.yml build backend
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity build identity
      - name: Start isolated source databases
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity up -d db identity-db
      - name: Apply both independent migrations
        run: |
          docker compose -f docker-compose.yml run --rm backend alembic upgrade head
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity run --rm identity alembic upgrade head
      - name: Verify separate dumps and network-isolated restores
        run: python scripts/verify_identity_db_backups.py
      - name: Confirm no backup files are tracked
        run: |
          test -z "$(git ls-files backups)"
          git status --short
