name: CI
on:
  pull_request:
    branches: [main, feat/ticket-inventory]
  push:
    branches: [main]
jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticket-inventory --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticket-purchasing --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate microservices-hexagonal-migration --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticketing-hexagonal-uow --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticketing-hexagonal-inventory-queries --strict
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build
