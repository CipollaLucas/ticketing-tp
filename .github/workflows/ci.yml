name: CI
on:
  pull_request:
    branches: [main, feat/ticket-inventory]
  push:
    branches: [main]
jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticket-inventory --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticket-purchasing --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate microservices-hexagonal-migration --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticketing-hexagonal-uow --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate ticketing-hexagonal-inventory-queries --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-independent-foundation --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-remote-introspection --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-backfill-preflight --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-cutover-readiness --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-backup-restore-verification --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-readonly-auth-canary --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate identity-cross-context-foreign-keys --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate events-independent-foundation --strict
      - run: npx --yes @fission-ai/openspec@2.1.1 validate events-ticketing-sales-state --strict
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ci-test-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
      - run: docker compose build

  identity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-identity-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-identity-only@localhost:5432/postgres
      IDENTITY_INTERNAL_TOKEN: ci-only-identity-internal-token-for-tests-2026
    defaults:
      run:
        working-directory: services/identity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy identity
      - run: alembic upgrade head
      - run: alembic current
      - run: pytest -q
      - run: docker build -t identity-service-ci .
        working-directory: services/identity

  identity-contract:
    runs-on: ubuntu-latest
    env:
      IDENTITY_INTERNAL_TOKEN: ci-only-contract-internal-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Build Identity and legacy backend with private networking
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity build identity backend
      - name: Start private Identity PostgreSQL
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity up -d identity-db
      - name: Apply Identity-owned migration
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity run --rm identity alembic upgrade head
      - name: Start Identity and legacy backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity up -d identity backend
      - name: Verify remote login, token introspection and logout
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity exec -T backend python identity_contract_smoke.py
      - name: Start isolated Identity-only HTTP gateway preview
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml -f docker-compose.identity-gateway-preview.yml --profile identity --profile identity-gateway-preview up -d identity-gateway-preview
      - name: Test public Stage I auth contract through gateway and fail-closed Events
        run: python scripts/identity_gateway_preview_smoke.py

  db-backup-restore:
    runs-on: ubuntu-latest
    env:
      IDENTITY_INTERNAL_TOKEN: ci-backup-configuration-only-token-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build backend and Identity images
        run: |
          docker compose -f docker-compose.yml build backend
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity build identity
      - name: Start isolated source databases
        run: |
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity up -d db identity-db
      - name: Apply both independent migrations
        run: |
          docker compose -f docker-compose.yml run --rm backend alembic upgrade head
          docker compose -f docker-compose.yml -f docker-compose.identity.yml --profile identity run --rm identity alembic upgrade head
      - name: Verify separate dumps and network-isolated restores
        run: python scripts/verify_identity_db_backups.py
      - name: Confirm no backup files are tracked
        run: |
          test -z "$(git ls-files backups)"
          git status --short

  events:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: events-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:events-ci-only@localhost:5432/postgres
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:events-ci-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy events_service
      - run: pytest -q -rs
      - run: alembic upgrade head
      - run: alembic current
      - name: Probe independent health and catalog
        run: |
          uvicorn events_service.main:app --host 127.0.0.1 --port 8002 > /tmp/events.log 2>&1 &
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8002/health') as resp:
                      assert json.load(resp)['status'] == 'ok'
                  with urllib.request.urlopen('http://127.0.0.1:8002/api/v1/events') as resp:
                      assert json.load(resp)['total'] == 0
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Events service health/catalog not ready')
          PY
      - run: docker build -t ticketing-events-ci .
        working-directory: services/events

  h3-identity-events-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable contract-only credentials
        run: |
          token=$(openssl rand -hex 32)
          password=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "::add-mask::$password"
          echo "H3_INTERNAL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "H3_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build isolated Identity and Events images
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml build h3-identity h3-events h3-smoke
      - name: Start two isolated PostgreSQL databases
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml up -d --wait h3-identity-db h3-events-db
      - name: Apply independent owned schemas
        run: |
          docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml run --rm --no-deps h3-identity alembic upgrade head
          docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml run --rm --no-deps h3-events alembic upgrade head
      - name: Seed only disposable Identity database
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml run --rm --no-deps h3-identity python -m identity.h3_contract_seed
      - name: Start both independent HTTP services
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml up -d --wait h3-identity h3-events
      - name: Verify real HTTP auth, ownership, roles and session revocation
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml run --rm h3-smoke --phase online
      - name: Stop Identity while leaving Events running
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml stop h3-identity
      - name: Verify Events fails closed during Identity outage
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml run --rm --no-deps h3-smoke --phase outage
      - name: Tear down disposable containers and network
        if: always()
        run: docker compose -p h3-contract-ci -f docker-compose.h3-contract.yml down --remove-orphans

  ticketing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ticketing-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ticketing-ci-only@localhost:5432/postgres
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:ticketing-ci-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/ticketing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy ticketing_service
      - run: pytest -q -rs
      - run: alembic upgrade head
      - run: alembic current
      - name: Verify standalone Ticketing health
        run: |
          uvicorn ticketing_service.main:app --host 127.0.0.1 --port 8003 > /tmp/ticketing.log 2>&1 &
          python - <<'PY'
          import json, time, urllib.request
          for _ in range(30):
              try:
                  with urllib.request.urlopen('http://127.0.0.1:8003/health') as r:
                      assert json.load(r)['database'] == 'ok'
                  with urllib.request.urlopen('http://127.0.0.1:8003/api/v1/internal/sales/availability') as r:
                      data=json.load(r)
                      assert data['sale_commands_enabled'] is False
                      assert data['purchases_enabled'] is False
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Ticketing H4 health did not become ready')
          PY
      - run: docker build -t ticketing-h4-foundation-ci .
        working-directory: services/ticketing

  h4-three-service-live:
    runs-on: ubuntu-latest
    env:
      H4_PROJECT: h4-live-ci
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable UAT credentials
        run: |
          token=$(openssl rand -hex 32)
          sales=$(openssl rand -hex 32)
          password=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "::add-mask::$sales"
          echo "::add-mask::$password"
          echo "H3_INTERNAL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "H4_SALES_TOKEN=$sales" >> "$GITHUB_ENV"
          echo "H3_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Build independent Identity Events and Ticketing images
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml build h3-identity h3-events h4-ticketing h4-live-smoke h4-confirmed-order-smoke h4-concurrent-http-smoke
      - name: Start three disposable PostgreSQL databases
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml up -d --wait h3-identity-db h3-events-db h4-ticketing-db
      - name: Apply independent schema migrations
        run: |
          for service in h3-identity h3-events h4-ticketing; do
            docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml run --rm --no-deps "$service" alembic upgrade head
          done
      - name: Seed only disposable Identity users
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml run --rm --no-deps h3-identity python -m identity.h3_contract_seed
      - name: Start three independent HTTP services
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml up -d --wait h3-identity h4-ticketing h3-events
      - name: Run publish unpublish and republish contract over HTTP
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml run --rm --no-deps h4-live-smoke
      - name: Test confirmed order prevents unpublish through real Events HTTP
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml run --rm --no-deps h4-confirmed-order-smoke
      - name: Race real HTTP purchase versus unpublish across three services
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml run --rm --no-deps h4-concurrent-http-smoke
      - name: Show service logs if unsuccessful
        if: failure()
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml logs --tail 100 h3-identity h3-events h4-ticketing
      - name: Remove ONLY this disposable project (no named volumes)
        if: always()
        run: |
          docker compose -p "$H4_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml down


  h5-gateway-stage-i:
    # Playwright 1.56 supports Ubuntu 24.04; ubuntu-latest may resolve to 26.04.
    runs-on: ubuntu-24.04
    env:
      H5_PROJECT: h5-gateway-ci
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable H5 credentials
        run: |
          token=$(openssl rand -hex 32)
          sales=$(openssl rand -hex 32)
          password=$(openssl rand -hex 24)
          echo "::add-mask::$token"
          echo "::add-mask::$sales"
          echo "::add-mask::$password"
          echo "H3_INTERNAL_TOKEN=$token" >> "$GITHUB_ENV"
          echo "H4_SALES_TOKEN=$sales" >> "$GITHUB_ENV"
          echo "H3_TEST_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Check static Gateway route ownership
        run: python scripts/h5_gateway_contract_check.py
      - name: Build disposable three-service Gateway UAT
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml build h3-identity h3-events h4-ticketing h5-gateway-smoke
      - name: Start three disposable PostgreSQL databases
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml up -d --wait h3-identity-db h3-events-db h4-ticketing-db
      - name: Apply owned schemas and seed disposable Identity only
        run: |
          for service in h3-identity h3-events h4-ticketing; do
            docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml run --rm --no-deps "$service" alembic upgrade head
          done
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml run --rm --no-deps h3-identity python -m identity.h3_contract_seed
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml run --rm --no-deps h3-identity python -m identity.h5_admin_seed
      - name: Start the independent services and Gateway (no Legacy)
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml up -d --wait h3-identity h3-events h4-ticketing h5-gateway
      - name: Validate NGINX configuration with upstream DNS available
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml exec -T h5-gateway nginx -t
      - name: Exercise Stage I through Gateway only
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml run --rm --no-deps h5-gateway-smoke | tee "$RUNNER_TEMP/h5-smoke.log"
      - name: Verify cross-service audit correlation and times
        run: python scripts/verify_h5_correlation.py "$H5_PROJECT" "$RUNNER_TEMP/h5-smoke.log"
      - name: Install Chromium browser test dependencies
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Install frontend packages and start Vite against H5 Gateway
        run: |
          cd frontend
          npm install --no-audit --no-fund
          VITE_API_PROXY_TARGET=http://127.0.0.1:8091 npm run dev -- --host 127.0.0.1 > "$RUNNER_TEMP/h5-vite.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/h5-vite.pid"
          cd ..
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null
      - name: Exercise real React workspace in Chromium without Legacy
        env:
          H5_DISPOSABLE_BROWSER_UAT: "yes"
        run: python scripts/h5_react_browser_uat.py
      - name: Restart only H5 application containers (retain all disposable PostgreSQL)
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml restart h3-identity h3-events h4-ticketing
          # Gateway /health is a local NGINX return, not an upstream readiness check.
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml up -d --wait h3-identity h3-events h4-ticketing h5-gateway
          # Resolve upstream container addresses again after application restarts.
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml exec -T h5-gateway nginx -t
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml exec -T h5-gateway nginx -s reload
          # Probe a route that actually crosses NGINX to an application.
          for attempt in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:8091/api/v1/events?limit=1&offset=0" >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Gateway upstream still unavailable after restart"
              exit 1
            fi
            sleep 1
          done
      - name: Verify persistence and idempotency after H5 restarts
        env:
          H5_DISPOSABLE_RESTART_UAT: "yes"
        run: python scripts/verify_h5_restart.py "$RUNNER_TEMP/h5-smoke.log"
      - name: Verify offline restores of all three disposable PostgreSQL databases
        env:
          H5_DISPOSABLE_RESTORE_UAT: "yes"
        run: python scripts/verify_h5_three_db_restore.py "$RUNNER_TEMP/h5-smoke.log"
      - name: Upload browser screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h5-browser-screenshots
          path: ${{ runner.temp }}/h5-browser/
          if-no-files-found: ignore
      - name: Inspect Gateway and services when failed
        if: failure()
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml logs --tail 100 h5-gateway h3-identity h3-events h4-ticketing
      - name: Remove only disposable H5 project (no volumes)
        if: always()
        run: |
          docker compose -p "$H5_PROJECT" -f docker-compose.h3-contract.yml -f docker-compose.h4-live.yml -f docker-compose.h5-gateway-preview.yml down
