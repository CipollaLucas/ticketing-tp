# H5 preview: only public Stage I Identity endpoints; no mixed Legacy sessions.
# This is NOT a production /api/v1 gateway.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","mode":"identity-preview-only"}';
    }

    location /api/v1/auth/ {
        proxy_pass http://identity:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_intercept_errors off;
    }

    location /api/v1/users/ {
        proxy_pass http://identity:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/v1/admin/users/ {
        proxy_pass http://identity:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Never route Events, Ticketing or Legacy behind an Identity-issued token.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"Identity preview only; commercial operations unavailable"}';
    }

    location / {
        return 404;
    }
}
