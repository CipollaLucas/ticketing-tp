# H5 disposable preview only; never proxy to Legacy.
# The exact order route MUST precede the generic Events prefix.
log_format h5_access 'request_id=$request_id method=$request_method path=$uri '
                     'status=$status request_time=$request_time upstream_time=$upstream_response_time';
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log /dev/stdout h5_access;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_intercept_errors off;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","mode":"three-service-preview"}';
    }

    # Browser requests never reach service-to-service endpoints.
    location ^~ /api/v1/internal/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 404 '{"detail":"Not found"}';
    }

    location ^~ /api/v1/auth/ { proxy_pass http://h3-identity:8001; }
    location ^~ /api/v1/users/ { proxy_pass http://h3-identity:8001; }
    location ^~ /api/v1/admin/users/ { proxy_pass http://h3-identity:8001; }

    location ^~ /api/v1/owner/events { proxy_pass http://h3-events:8002; }

    # React Stage I purchases use /orders; never proxy these writes to Legacy.
    location = /api/v1/orders { proxy_pass http://h4-ticketing:8003; }

    # Regex purchase route takes precedence over ordinary Events prefix (no ^~).
    location ~ ^/api/v1/events/[^/]+/orders/?$ {
        proxy_pass http://h4-ticketing:8003;
    }

    # Zone creation belongs to Ticketing and is disabled outside disposable UAT.
    location ~ ^/api/v1/events/[^/]+/zones/?$ {
        proxy_pass http://h4-ticketing:8003;
    }

    # Inventory belongs to Ticketing and must precede the ordinary Events prefix.
    location ~ ^/api/v1/events/[^/]+/inventory/?$ {
        proxy_pass http://h4-ticketing:8003;
    }

    location = /api/v1/events { proxy_pass http://h3-events:8002; }
    location /api/v1/events/ { proxy_pass http://h3-events:8002; }

    location = /api/v1/me/tickets { proxy_pass http://h4-ticketing:8003; }

    # Other not-yet-extracted inventory writes remain unavailable.
    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"detail":"Route not available in independent services"}';
    }
    location / { return 404; }
}
